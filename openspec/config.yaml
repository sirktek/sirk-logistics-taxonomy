schema: spec-driven

context: |
  sirk-logistics-taxonomy: Java 17 library (Apache Jena, JUnit 5) holding Sirktek's logistics and
  real-estate RDF-S taxonomy (logistics-base.ttl, namespace http://taxonomy.sirktek.no/logistics#):
  Location, RealEstate, OperatedProperty (driftsobjekt), ControlPoint, Freight, transport classes.
  LogisticsRdfsTaxonomyLoader extends RdfsTaxonomyLoader from no.sirktek:taxonomy-commons, which also
  ships common-base.ttl (namespace http://taxonomy.sirktek.no/common#); a class opts into a commons
  property with `common:<p> schema:domainIncludes logistics:<Class>` in this repo's TTL. Released as
  3.<run number> to GitHub Packages on merge to main. Consumers: sirk-orgadmin-backend (and, through
  it, the asset frontends). Maven goes through `mvnq` (same arguments as ./mvnw). Taxonomies are
  data: no Java code specific to a class or property.

rules:
  tasks:
    - "Group tasks as ### Group N: <name>, each listing the files it may touch and its test command."
